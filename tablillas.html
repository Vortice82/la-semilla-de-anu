<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablillas - La Semilla de Anu</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: #1b263b;
            border-bottom: 2px solid #e5989b;
        }
        .stats {
            margin: 10px;
            font-weight: bold;
            color: #778da9;
            letter-spacing: 1px;
        }
        canvas {
            background: radial-gradient(circle, #1b263b 0%, #080f1a 100%);
            border: 5px solid #415a77;
            border-radius: 10px;
            max-width: 90vw;
            max-height: 70vh;
            display: block;
        }
        .btn-volver {
            margin-top: 15px;
            padding: 10px 20px;
            background: #e5989b;
            color: #0d1b2a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(13, 27, 42, 0.9);
            padding: 20px;
            border: 2px solid #e5989b;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size: 1.2rem; color: #e5989b;">TABLILLAS DE ANU</h1>
    </header>

    <div class="stats">
        PUNTOS: <span id="score">0</span> | VIDAS: <span id="lives">3</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h2 id="statusText">FIN DEL JUEGO</h2>
        <button onclick="document.location.reload()" style="padding:10px; cursor:pointer;">REINTENTAR</button>
    </div>

    <a href="juego.html" class="btn-volver">⬅ VOLVER A JUEGOS</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const overlay = document.getElementById("overlay");

        canvas.width = 400;
        canvas.height = 500;

        let score = 0;
        let lives = 3;
        let ball = { x: 200, y: 450, dx: 3, dy: -3, radius: 7 };
        let paddle = { w: 80, h: 12, x: 160 };
        
        const colors = ["#b07d4b", "#9d5c31", "#6d3d6d", "#4a7c7a", "#2b5082"];
        let bricks = [];
        for(let c=0; c<6; c++) {
            bricks[c] = [];
            for(let r=0; r<7; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r % colors.length] };
            }
        }

        // Control ratón y táctil
        function moverPala(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let relX = clientX - rect.left;
            if(relX > 0 && relX < canvas.width) paddle.x = relX - paddle.w/2;
        }
        canvas.addEventListener("mousemove", moverPala);
        canvas.addEventListener("touchmove", (e) => { moverPala(e); e.preventDefault(); }, {passive: false});

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Ladrillos
            let allCleared = true;
            for(let c=0; c<6; c++) {
                for(let r=0; r<7; r++) {
                    let b = bricks[c][r];
                    if(b.status == 1) {
                        allCleared = false;
                        b.x = c * 62 + 15; b.y = r * 25 + 40;
                        ctx.fillStyle = b.color;
                        ctx.fillRect(b.x, b.y, 58, 20);
                        if(ball.x > b.x && ball.x < b.x+58 && ball.y > b.y && ball.y < b.y+20) {
                            ball.dy = -ball.dy; b.status = 0; score += 10;
                            scoreEl.innerHTML = score;
                        }
                    }
                }
            }
            if(allCleared) { 
                document.getElementById("statusText").innerHTML = "¡VICTORIA!";
                overlay.style.display = "block"; return; 
            }

            // Bola y Pala
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = "#ff6200"; ctx.fill(); ctx.closePath();
            ctx.fillStyle = "#415a77"; ctx.fillRect(paddle.x, canvas.height-20, paddle.w, paddle.h);

            // Rebotes y Lógica
            if(ball.x + ball.dx > canvas.width || ball.x + ball.dx < 0) ball.dx = -ball.dx;
            if(ball.y + ball.dy < 0) ball.dy = -ball.dy;
            else if(ball.y + ball.dy > canvas.height-20) {
                if(ball.x > paddle.x && ball.x < paddle.x + paddle.w) ball.dy = -ball.dy;
                else {
                    lives--; livesEl.innerHTML = lives;
                    if(!lives) { overlay.style.display = "block"; return; }
                    else { ball.x = 200; ball.y = 450; ball.dx = 3; ball.dy = -3; }
                }
            }
            ball.x += ball.dx; ball.y += ball.dy;
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
